# Multi-domain model hyperparameters and paths (relative to repo root).

domain: multi_domain

mode: production  # dev | production

model:
  dev:
    common_dim: 64
    hidden_dim: 64          # = common_dim
    num_heads: 2
    feedforward_dim: 128
    head_hidden_dim: 32
    head_num_layers: 1
    seq_len: 12
    num_layers: 2
    dropout: 0.1
  production:
    common_dim: 256
    hidden_dim: 256         # = common_dim
    num_heads: 8
    feedforward_dim: 1024
    head_hidden_dim: 128
    head_num_layers: 2
    seq_len: 12
    num_layers: 6
    dropout: 0.1

training:
  initial_lr:   1.0e-6   # sweep start for LR finder; optimal typically 1e-5–3e-4 for AdamW transformers
  optimized_lr: null     # set after running LR finder; overrides initial_lr when set
  lr_scheduler: cosine
  dev:
    pretrain_epochs: 20
    finetune_epochs: 10
    warmup_epochs:   2
    early_stopping_patience: 5
    eval_every_n_epochs: 1
    steps_per_epoch: null  # null = len(train_loader) of the domain with the most windows
    batch_size: 64
    finetune_lr: 1.0e-3   # Stage 2 fallback LR
    weight_decay: 1.0e-4
  production:
    pretrain_epochs: 100
    finetune_epochs: 50
    warmup_epochs:   5       # Stage 2 only
    early_stopping_patience: 10
    eval_every_n_epochs: 2
    steps_per_epoch: null
    batch_size: 1024
    finetune_lr: 1.0e-3      # Stage 2 fallback LR
    weight_decay: 1.0e-4

preprocessing:
  # Splits are reused from the per-domain pipelines.
  dev:
    stride: 1
    random_seed: 42  # unused
  production:
    stride: 1
    random_seed: 42  # unused

mlflow:
  enabled: false            # not wired into 01-04 yet; flipping is a no-op
  tracking_uri: mlruns
  experiment: multi_domain

paths:
  # Per-domain inputs from the individual pipelines
  arctic:
    preprocessed_dir: outputs/arctic_domain/preprocessed
    scaler: outputs/arctic_domain/scaler.pkl
    train_label: "500K_s400"  # -> train_500K_s400.pkl (500K windows, stride 400)
  amazon:
    preprocessed_dir: outputs/amazon_domain/preprocessed
    scaler: outputs/amazon_domain/scaler.pkl
  rangeland:
    preprocessed_dir: outputs/rangeland_domain/preprocessed
    scaler: outputs/rangeland_domain/scaler.pkl
  # Multi-domain outputs
  models_dir: outputs/multi_domain/models
  predictions_dir: outputs/multi_domain/predictions
  evaluation_dir: outputs/multi_domain/evaluation
