domain: rangeland_domain
mode: production  # dev | production — selects hyperparameter profile; flip here to switch modes

# ── Data ──────────────────────────────────────────────────────────────────────
data:
  dir: RangeSTAR_data/
  files:
    - NEE-desert-scrub_predictions_20260516_212821.csv
    - NEE-grass_predictions_20260518_010539.csv
    - NEE-grass-tree_predictions_20260515_192224.csv
    - NEE-sagebrush_predictions_20260515_232033.csv

# ── Columns ───────────────────────────────────────────────────────────────────
columns:
  id:            [site, time, PFT]
  static:        [clay]
  dynamic:       [EVI2, tsoil, sm1, sm2, vpd, SW_IN_NLDAS, tavg, tmax, tmin, prcp]
  pft_order:     [desert-scrub, grass, grass-tree, sagebrush]   # canonical one-hot encoding order
  site_clim_cols: [prcp, tavg, vpd, tsoil, SW_IN_NLDAS]         # columns used for per-site climatological means

# ── Targets ───────────────────────────────────────────────────────────────────
# All RangeSTAR process-model outputs. NEE is derived (RECO - GPP) at inference.
targets:
  fluxes: [GPP_predicted, RECO_predicted, Rm_predicted, Rg_predicted]   # g C m-2 d-1
  pools:  [AGB_predicted, BGB_predicted, AGL_predicted, BGL_predicted,
           POC_predicted, HOC_predicted]                                  # g C m-2

# ── Preprocessing ─────────────────────────────────────────────────────────────
preprocessing:
  random_seed:            42
  train_frac:             0.60
  val_frac:               0.20
  test_frac:              0.20
  min_records_per_month:  4    # drop site-months with fewer pentad records before aggregating
  dev:
    seq_len: 12   # months of context window
    stride:  6    # step between windows (sparse sampling for fast dev iteration)
  production:
    seq_len: 12   # months of context window — matches all other domains
    stride:  1

# ── Model ─────────────────────────────────────────────────────────────────────
model:
  architecture: transformer   # only 'transformer' is implemented; key reserved for future variants
  dev:                  # tiny model for a fast smoke test (not meant to learn well)
    hidden_dim:      16
    num_layers:      1
    num_heads:       2
    dropout:         0.1
    feedforward_dim: 32
  production:           # small dataset (~41 train sites, ~2k prod windows): small model + high dropout to limit overfit. A100 40GB, no grid search.
    hidden_dim:      64
    num_layers:      3
    num_heads:       4
    dropout:         0.3
    feedforward_dim: 256

# Ablation-only: matches the multi-domain shared trunk's production capacity (see
# ablation_test/ablation_description.md), used via --capacity-matched. Not a dev/production
# profile — config.py's mode resolution leaves this section untouched.
model_capacity_matched:
  hidden_dim:      256
  num_layers:      6
  num_heads:       8
  dropout:         0.1
  feedforward_dim: 1024

# Ablation-only: exact copy of amazon_domain.yaml's production architecture (dropout included,
# unchanged) — a middle-capacity control between the undersized production config above (152K
# params, "no grid search") and model_capacity_matched (4.7M params, the multi-domain trunk's
# size). Used via --amazon-sized. See ablation_test/ablation_description.md.
model_amazon_sized:
  hidden_dim:      128
  num_layers:      3
  num_heads:       4
  dropout:         0.2
  feedforward_dim: 512

# Hyperparameter-tuning sweep candidates (single architecture dimension: hidden_dim), used via
# --model-size. Base (num_layers/num_heads/feedforward_dim) is Rangeland's own production
# architecture, unchanged — only hidden_dim varies (half/current/double of the production
# value, same convention as arctic_domain.yaml/amazon_domain.yaml). Dropout is fixed at 0.15
# for these blocks specifically (differs from the live production value of 0.3 above, chosen
# to fight overfitting on this domain's small dataset — untouched) for consistency across
# every domain/size in this sweep — see
# hyperparameter_tuning/hyperparameter_tuning_description.md. "medium" = current production
# hidden_dim.
model_small:
  hidden_dim:      32
  num_layers:      3
  num_heads:       4
  dropout:         0.15
  feedforward_dim: 256
model_medium:
  hidden_dim:      64
  num_layers:      3
  num_heads:       4
  dropout:         0.15
  feedforward_dim: 256
model_large:
  hidden_dim:      128
  num_layers:      3
  num_heads:       4
  dropout:         0.15
  feedforward_dim: 256
# Extends the sweep past "large" -- small/medium/large (32/64/128) showed a monotonic,
# non-plateauing improvement (val loss 0.042/0.042/0.038), unlike Arctic/Amazon where the top
# two sizes tied or were within noise. xlarge checks whether the trend continues or plateaus.
model_xlarge:
  hidden_dim:      256
  num_layers:      3
  num_heads:       4
  dropout:         0.15
  feedforward_dim: 256
# xlarge (256) improved further still (val loss 0.038 -> 0.0249), no plateau yet -- xxlarge
# doubles again, feedforward_dim held fixed at 256 (same as every prior size in this sweep)
# so hidden_dim stays the only changed variable.
model_xxlarge:
  hidden_dim:      512
  num_layers:      3
  num_heads:       4
  dropout:         0.15
  feedforward_dim: 256

# ── Training ──────────────────────────────────────────────────────────────────
training:
  optimizer:           adamw
  loss:                mse
  weight_decay:        1.0e-4
  initial_lr:          1.0e-6   # sweep start for LR finder; optimal typically 1e-5–3e-4 for AdamW transformers
  optimized_lr:        null     # set after running LR finder; overrides initial_lr when set
  lr_scheduler:        cosine   # options: cosine | step | none
  eval_every_n_epochs: 1
  dev:
    batch_size:              32
    num_epochs:              3
    warmup_epochs:           1
    early_stopping_patience: 3
  production:           # batch 64 keeps gradient noise for generalisation on the tiny dataset (not memory-bound on 40GB)
    batch_size:              64
    num_epochs:              100
    warmup_epochs:           5
    early_stopping_patience: 12

# ── Paths ─────────────────────────────────────────────────────────────────────
paths:
  preprocessed_dir: outputs/rangeland_domain/preprocessed/
  scaler:           outputs/rangeland_domain/scaler.pkl
  best_model:       outputs/rangeland_domain/models/best_model.pt
  predictions:      outputs/rangeland_domain/predictions/
  evaluation:       outputs/rangeland_domain/evaluation/

# ── Experiment tracking (MLflow) ──────────────────────────────────────────────
mlflow:
  enabled:      true
  tracking_uri: mlruns            # local file store at repo root; no server needed
  experiment:   rangeland_domain
