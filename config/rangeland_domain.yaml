domain: rangeland_domain
mode: dev  # dev | production — selects hyperparameter profile; flip here to switch modes

# ── Data ──────────────────────────────────────────────────────────────────────
data:
  dir: RangeSTAR_data/
  files:
    - NEE-desert-scrub_predictions_20260516_212821.csv
    - NEE-grass_predictions_20260518_010539.csv
    - NEE-grass-tree_predictions_20260515_192224.csv
    - NEE-sagebrush_predictions_20260515_232033.csv

# ── Columns ───────────────────────────────────────────────────────────────────
columns:
  id:            [site, time, PFT]
  static:        [clay]
  dynamic:       [EVI2, tsoil, sm1, sm2, vpd, SW_IN_NLDAS, tavg, tmax, tmin, prcp]
  pft_order:     [desert-scrub, grass, grass-tree, sagebrush]   # canonical one-hot encoding order
  site_clim_cols: [prcp, tavg, vpd, tsoil, SW_IN_NLDAS]         # columns used for per-site climatological means

# ── Targets ───────────────────────────────────────────────────────────────────
# All RangeSTAR process-model outputs. NEE is derived (RECO - GPP) at inference.
targets:
  fluxes: [GPP_predicted, RECO_predicted, Rm_predicted, Rg_predicted]   # g C m-2 d-1
  pools:  [AGB_predicted, BGB_predicted, AGL_predicted, BGL_predicted,
           POC_predicted, HOC_predicted]                                  # g C m-2

# ── Preprocessing ─────────────────────────────────────────────────────────────
preprocessing:
  random_seed:            42
  train_frac:             0.70
  val_frac:               0.15
  test_frac:              0.15
  min_records_per_month:  4    # drop site-months with fewer pentad records before aggregating
  dev:
    seq_len: 6    # months of context window
    stride:  6    # step between windows (sparse sampling for fast dev iteration)
  production:
    seq_len: 12   # longer window to give slow carbon pools more context (revisit if pools underperform)
    stride:  1

# ── Model ─────────────────────────────────────────────────────────────────────
model:
  architecture: transformer   # only 'transformer' is implemented; key reserved for future variants
  dev:                  # tiny model for a fast smoke test (not meant to learn well)
    hidden_dim:      16
    num_layers:      1
    num_heads:       2
    dropout:         0.1
    feedforward_dim: 32
  production:           # small dataset (~41 train sites, ~2k prod windows): small model + high dropout to limit overfit. A100 40GB, no grid search.
    hidden_dim:      64
    num_layers:      3
    num_heads:       4
    dropout:         0.3
    feedforward_dim: 256

# ── Training ──────────────────────────────────────────────────────────────────
training:
  optimizer:           adam
  loss:                mse
  initial_lr:          1.0e-3   # starting point for LR finder; fallback if optimized_lr is null
  optimized_lr:        null     # set after running LR finder; overrides initial_lr when set
  lr_scheduler:        cosine   # options: cosine | step | none
  eval_every_n_epochs: 1
  dev:
    batch_size:              32
    num_epochs:              3
    early_stopping_patience: 3
  production:           # batch 64 keeps gradient noise for generalisation on the tiny dataset (not memory-bound on 40GB)
    batch_size:              64
    num_epochs:              100
    early_stopping_patience: 12

# ── Paths ─────────────────────────────────────────────────────────────────────
paths:
  preprocessed_dir: outputs/rangeland_domain/preprocessed/
  scaler:           outputs/rangeland_domain/scaler.pkl
  best_model:       outputs/rangeland_domain/models/best_model.pt
  predictions:      outputs/rangeland_domain/predictions/
  evaluation:       outputs/rangeland_domain/evaluation/

# ── Experiment tracking (MLflow) ──────────────────────────────────────────────
mlflow:
  enabled:      true
  tracking_uri: mlruns            # local file store at repo root; no server needed
  experiment:   rangeland_domain
