domain: amazon_domain
mode: production  # dev | production — selects hyperparameter profile; flip here to switch modes

# ── GCS ───────────────────────────────────────────────────────────────────────
gcs:
  bucket: gs://fr_v1/am_hydro_fire_risk_V2
  files:
    fire_risk_monthly: FR_Monthly_NaturalVeg_2000_2024_v16.csv
    station_list:      ANA_StationList_filteredAF_nov2025.csv
    # GeoPackage of per-station drainage basins; only the attribute table (EstacCd,
    # Latitud, Longitd) is used, for the evaluation station map — not part of the modeling
    # feature set, so not in columns.rename.
    station_coords:    main_drainage_Filtered_checkLU_v4.gpkg

# ── Columns ───────────────────────────────────────────────────────────────────
columns:
  id:             [station_id, year, month]
  # raw CSV column -> clean name (authoritative source for the 12 loaded raw columns;
  # scripts apply this map and must not hardcode it). month_sin/month_cos are computed later.
  rename:
    EstacaoCod: station_id
    year:       year
    month:      month
    Prec:       precip
    tmax:       tmax
    tmin:       tmin
    ET:         et
    vpd:        vpd
    DrangAr:    drainage_area
    vazao:      discharge
    AF:         active_fire_count
    BA:         burned_area
  dynamic:        [precip, tmax, tmin, et, vpd, drainage_area, month_sin, month_cos]
  site_clim_cols: [precip, tmax, tmin]   # used for per-station climatological mean/std

# ── Targets ───────────────────────────────────────────────────────────────────
targets: [discharge, active_fire_count, burned_area]

# ── Preprocessing ─────────────────────────────────────────────────────────────
preprocessing:
  random_seed: 42
  train_frac:  0.60
  val_frac:    0.20
  test_frac:   0.20
  dev:
    seq_len: 12   # months of context window
    stride:  24   # step between windows (sparse sampling for fast dev iteration)
  production:
    seq_len: 12
    stride:  1

# ── Model ─────────────────────────────────────────────────────────────────────
model:
  architecture:  transformer   # only 'transformer' is implemented; key reserved for future variants
  nonneg_output: true          # softplus on the output head — discharge/active_fire_count/burned_area are all >=0
  dev:                  # tiny model for a fast smoke test (not meant to learn well)
    hidden_dim:      16
    num_layers:      1
    num_heads:       2
    dropout:         0.1
    feedforward_dim: 32
  production:           # picked from the hyperparameter-tuning architecture-search walk
                         # (hidden_dim -> feedforward_dim -> num_layers -> dropout; see
                         # hyperparameter_tuning_description.md's "Amazon extension"/"Amazon
                         # feedforward_dim sweep"/"Amazon num_layers sweep"/"Amazon dropout
                         # sweep" and key_findings_log.md AZ-retune0813). All 4 dimensions came
                         # back statistically flat (noise, not signal) -- this smaller/faster
                         # config was chosen for efficiency, not because it measurably
                         # outperforms the prior 128/512/0.2 config. Was hidden_dim=128,
                         # num_layers=3, num_heads=4, dropout=0.2, feedforward_dim=512.
    hidden_dim:      64
    num_layers:      3
    num_heads:       4      # 64/4=16 dim/head
    dropout:         0.10
    feedforward_dim: 256    # 4:1 ratio (hidden=64)

# Ablation-only: matches the multi-domain shared trunk's production capacity (see
# ablation_test/ablation_description.md), used via --capacity-matched. Not a dev/production
# profile — config.py's mode resolution leaves this section untouched.
model_capacity_matched:
  hidden_dim:      256
  num_layers:      6
  num_heads:       8
  dropout:         0.1
  feedforward_dim: 1024

# Hyperparameter-tuning sweep candidates (single architecture dimension: hidden_dim), used via
# --model-size. Base (num_layers/num_heads/feedforward_dim) is Amazon's real production
# architecture, unchanged — only hidden_dim varies. Dropout is fixed at 0.15 for these blocks
# specifically (differs from the live production value of 0.2 above, which is untouched) for
# consistency across every domain/size in this sweep — see
# hyperparameter_tuning/hyperparameter_tuning_description.md. "medium" = current production hidden_dim.
# xsmall/xxsmall added after small/medium/large came back flat (0.517/0.518/0.517, noise-level)
# to check where -- if anywhere -- performance actually drops off below 64 (see "Resolution"
# in hyperparameter_tuning_description.md).
model_xxsmall:
  hidden_dim:      16
  num_layers:      3
  num_heads:       4
  dropout:         0.15
  feedforward_dim: 512
model_xsmall:
  hidden_dim:      32
  num_layers:      3
  num_heads:       4
  dropout:         0.15
  feedforward_dim: 512
model_small:
  hidden_dim:      64
  num_layers:      3
  num_heads:       4
  dropout:         0.15
  feedforward_dim: 512
model_medium:
  hidden_dim:      128
  num_layers:      3
  num_heads:       4
  dropout:         0.15
  feedforward_dim: 512
model_large:
  hidden_dim:      256
  num_layers:      3
  num_heads:       4
  dropout:         0.15
  feedforward_dim: 512

# hidden_dim sweep (above) found no real signal across 16-256 -- see "Resolution"/"Amazon
# extension" in hyperparameter_tuning_description.md. Fixed at hidden_dim=64 (model_small's
# value) and sweeping feedforward_dim instead: the hidden_dim sweep held feedforward_dim=512
# fixed throughout, which is an 8:1 ratio at hidden_dim=64 -- unusually wide relative to the
# standard 4:1 transformer convention (and to Amazon's own production ratio: hidden=128/ffn=512
# is exactly 4:1). model_small (512, already computed) is the 8:1 point; these two add the 2:1
# and 4:1 points.
model_ffn_narrow:
  hidden_dim:      64
  num_layers:      3
  num_heads:       4
  dropout:         0.15
  feedforward_dim: 128
model_ffn_std:
  hidden_dim:      64
  num_layers:      3
  num_heads:       4
  dropout:         0.15
  feedforward_dim: 256

# feedforward_dim sweep (above) also found no real signal -- see "Amazon feedforward_dim sweep"
# in hyperparameter_tuning_description.md. Fixed at hidden_dim=64/feedforward_dim=256
# (model_ffn_std's values -- the marginal-best, standard-ratio point) and sweeping num_layers
# instead. model_ffn_std (num_layers=3, already computed) is the 3-layer point; these two add
# 2 and 4 layers. 6 also included to match the multi-domain shared trunk's depth as a reference.
model_layers2:
  hidden_dim:      64
  num_layers:      2
  num_heads:       4
  dropout:         0.15
  feedforward_dim: 256
model_layers4:
  hidden_dim:      64
  num_layers:      4
  num_heads:       4
  dropout:         0.15
  feedforward_dim: 256
model_layers6:
  hidden_dim:      64
  num_layers:      6
  num_heads:       4
  dropout:         0.15
  feedforward_dim: 256

# num_layers sweep (above) also came back flat -- see "Amazon num_layers sweep" in
# hyperparameter_tuning_description.md. Fixed at hidden_dim=64/num_layers=3/feedforward_dim=256
# (model_ffn_std's settings) and sweeping dropout instead: 0.10/0.20/0.30 bracket the sweep
# blocks' fixed 0.15 (already computed via model_ffn_std) and Amazon's live production value
# (0.2); 0.30 also matches Rangeland's original (pre-retune) dropout for cross-domain reference.
model_dropout10:
  hidden_dim:      64
  num_layers:      3
  num_heads:       4
  dropout:         0.10
  feedforward_dim: 256
model_dropout20:
  hidden_dim:      64
  num_layers:      3
  num_heads:       4
  dropout:         0.20
  feedforward_dim: 256
model_dropout30:
  hidden_dim:      64
  num_layers:      3
  num_heads:       4
  dropout:         0.30
  feedforward_dim: 256

# ── Training ──────────────────────────────────────────────────────────────────
training:
  optimizer:           adamw
  loss:                mse
  weight_decay:        1.0e-4
  initial_lr:          1.0e-6   # sweep start for LR finder; optimal typically 1e-5–3e-4 for AdamW transformers
  optimized_lr:        null     # set after running LR finder; overrides initial_lr when set
  lr_scheduler:        cosine   # options: cosine | step | none
  eval_every_n_epochs: 1
  dev:
    batch_size:              32
    num_epochs:              3
    warmup_epochs:           1
    early_stopping_patience: 3
  production:           # batch 256 fits 40GB easily with good throughput at seq_len 12
    batch_size:              256
    num_epochs:              100
    warmup_epochs:           10
    early_stopping_patience: 12

# ── Paths ─────────────────────────────────────────────────────────────────────
paths:
  preprocessed_dir: outputs/amazon_domain/preprocessed/
  scaler:           outputs/amazon_domain/scaler.pkl
  best_model:       outputs/amazon_domain/models/best_model.pt
  predictions:      outputs/amazon_domain/predictions/
  evaluation:       outputs/amazon_domain/evaluation/

# ── Experiment tracking (MLflow) ──────────────────────────────────────────────
mlflow:
  enabled:      true
  tracking_uri: mlruns         # local file store at repo root; no server needed
  experiment:   amazon_domain
