domain: amazon_domain
mode: production  # dev | production — selects hyperparameter profile; flip here to switch modes

# ── GCS ───────────────────────────────────────────────────────────────────────
gcs:
  bucket: gs://fr_v1/am_hydro_fire_risk_V2
  files:
    fire_risk_monthly: FR_Monthly_NaturalVeg_2000_2024_v16.csv
    station_list:      ANA_StationList_filteredAF_nov2025.csv
    station_coords:    main_drainage_Filtered_checkLU_v4.gpkg   # drainage basins; for maps only, not a feature

# ── Columns ───────────────────────────────────────────────────────────────────
columns:
  id:             [station_id, year, month]
  # raw CSV column -> clean name (month_sin/month_cos computed later)
  rename:
    EstacaoCod: station_id
    year:       year
    month:      month
    Prec:       precip
    tmax:       tmax
    tmin:       tmin
    ET:         et
    vpd:        vpd
    DrangAr:    drainage_area
    vazao:      discharge
    AF:         active_fire_count
    BA:         burned_area
  dynamic:        [precip, tmax, tmin, et, vpd, drainage_area, month_sin, month_cos]
  site_clim_cols: [precip, tmax, tmin]   # used for per-station climatological mean/std

# ── Targets ───────────────────────────────────────────────────────────────────
targets: [discharge, active_fire_count, burned_area]

# ── Preprocessing ─────────────────────────────────────────────────────────────
preprocessing:
  random_seed: 42
  train_frac:  0.60
  val_frac:    0.20
  test_frac:   0.20
  dev:
    seq_len: 12   # months of context window
    stride:  24   # step between windows (sparse sampling for fast dev iteration)
  production:
    seq_len: 12
    stride:  1

# ── Model ─────────────────────────────────────────────────────────────────────
model:
  architecture:  transformer   # only 'transformer' is implemented; key reserved for future variants
  nonneg_output: false         # true = softplus head; off because targets are z-scored log1p
  dev:                  # tiny model for a fast smoke test (not meant to learn well)
    hidden_dim:      16
    num_layers:      1
    num_heads:       2
    dropout:         0.1
    feedforward_dim: 32
  production:           # from the hyperparameter-tuning sweeps (AZ-retune0813)
    hidden_dim:      64
    num_layers:      3
    num_heads:       4
    dropout:         0.10
    feedforward_dim: 256

# Ablation only (--capacity-matched): multi-domain trunk's production size.
model_capacity_matched:
  hidden_dim:      256
  num_layers:      6
  num_heads:       8
  dropout:         0.1
  feedforward_dim: 1024

# Sweep candidates (--model-size), see hyperparameter_tuning_description.md. hidden_dim sweep:
model_xxsmall:
  hidden_dim:      16
  num_layers:      3
  num_heads:       4
  dropout:         0.15
  feedforward_dim: 512
model_xsmall:
  hidden_dim:      32
  num_layers:      3
  num_heads:       4
  dropout:         0.15
  feedforward_dim: 512
model_small:
  hidden_dim:      64
  num_layers:      3
  num_heads:       4
  dropout:         0.15
  feedforward_dim: 512
model_medium:
  hidden_dim:      128
  num_layers:      3
  num_heads:       4
  dropout:         0.15
  feedforward_dim: 512
model_large:
  hidden_dim:      256
  num_layers:      3
  num_heads:       4
  dropout:         0.15
  feedforward_dim: 512

# feedforward_dim sweep (model_small = 512 point):
model_ffn_narrow:
  hidden_dim:      64
  num_layers:      3
  num_heads:       4
  dropout:         0.15
  feedforward_dim: 128
model_ffn_std:
  hidden_dim:      64
  num_layers:      3
  num_heads:       4
  dropout:         0.15
  feedforward_dim: 256

# num_layers sweep (model_ffn_std = 3-layer point):
model_layers2:
  hidden_dim:      64
  num_layers:      2
  num_heads:       4
  dropout:         0.15
  feedforward_dim: 256
model_layers4:
  hidden_dim:      64
  num_layers:      4
  num_heads:       4
  dropout:         0.15
  feedforward_dim: 256
model_layers6:
  hidden_dim:      64
  num_layers:      6
  num_heads:       4
  dropout:         0.15
  feedforward_dim: 256

# dropout sweep (model_ffn_std = 0.15 point):
model_dropout10:
  hidden_dim:      64
  num_layers:      3
  num_heads:       4
  dropout:         0.10
  feedforward_dim: 256
model_dropout20:
  hidden_dim:      64
  num_layers:      3
  num_heads:       4
  dropout:         0.20
  feedforward_dim: 256
model_dropout30:
  hidden_dim:      64
  num_layers:      3
  num_heads:       4
  dropout:         0.30
  feedforward_dim: 256

# ── Training ──────────────────────────────────────────────────────────────────
training:
  optimizer:           adamw
  loss:                mse
  weight_decay:        1.0e-4
  initial_lr:          1.0e-6   # sweep start for LR finder; optimal typically 1e-5–3e-4 for AdamW transformers
  optimized_lr:        null     # set after running LR finder; overrides initial_lr when set
  lr_scheduler:        cosine   # options: cosine | step | none
  eval_every_n_epochs: 1
  dev:
    batch_size:              32
    num_epochs:              3
    warmup_epochs:           1
    early_stopping_patience: 3
  production:
    batch_size:              256
    num_epochs:              100
    warmup_epochs:           10
    early_stopping_patience: 12

# ── Paths ─────────────────────────────────────────────────────────────────────
paths:
  preprocessed_dir: outputs/amazon_domain/preprocessed/
  scaler:           outputs/amazon_domain/scaler.pkl
  best_model:       outputs/amazon_domain/models/best_model.pt
  predictions:      outputs/amazon_domain/predictions/
  evaluation:       outputs/amazon_domain/evaluation/

# ── Experiment tracking (MLflow) ──────────────────────────────────────────────
mlflow:
  enabled:      true
  tracking_uri: mlruns         # local file store at repo root; no server needed
  experiment:   amazon_domain
