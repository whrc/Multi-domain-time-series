domain: arctic_domain
mode: dev  # dev | production — selects hyperparameter profile; flip here to switch modes

# ── GCS ───────────────────────────────────────────────────────────────────────
gcs:
  bucket: gs://circumpolar-readonly/raw
  eda_grids:
    - H1_V10
    - H1_V7
  target_subfolder: all_merged  # targets live in <grid>/<scenario>_split/all_merged/

# ── Scenarios ─────────────────────────────────────────────────────────────────
scenarios:
  - ssp1_2_6_mri_esm2_0
  - ssp5_8_5_mri_esm2_0

# ── Input files ───────────────────────────────────────────────────────────────
inputs:
  static:
    - soil-texture.nc
    - drainage.nc
    - fri-fire.nc
    - topo.nc
    - vegetation.nc
  dynamic_time_only:
    - co2.nc            # historical CO2; dim 'year' (int 1901–2024); linearly interpolated to monthly
    - projected-co2.nc  # projected CO2; dim 'year' (int 2025–2100); linearly interpolated to monthly
  dynamic_spatiotemporal:
    - historic-climate.nc
    - projected-climate.nc
    - historic-explicit-fire.nc   # yearly — excluded (near-constant spatial mean)
    - projected-explicit-fire.nc  # yearly — excluded

# ── Target files ──────────────────────────────────────────────────────────────
# Suffix _tr = historical, _sc = projected
# Historical targets only exist under ssp1_2_6 split folder (not ssp5_8_5)
targets:
  - name: ALD
    resolution: yearly
    historical: ALD_yearly_tr.nc
    projected: ALD_yearly_sc.nc
  - name: GPP
    resolution: monthly
    historical: GPP_monthly_tr.nc
    projected: GPP_monthly_sc.nc
  - name: RECO
    resolution: monthly
    historical: RECO_monthly_tr.nc
    projected: RECO_monthly_sc.nc
  - name: VEGC
    resolution: yearly
    historical: VEGC_yearly_tr.nc
    projected: VEGC_yearly_sc.nc

# ── Preprocessing ─────────────────────────────────────────────────────────────
preprocessing:
  random_seed: 42
  train_frac: 0.70
  val_frac:   0.15
  test_frac:  0.15
  dev:
    seq_len: 10
    stride:  360
    grids:         # required in dev — always targets specific grids
      - H1_V10
  production:
    seq_len: 24
    stride:  1
    # grids:       # optional in production — comment out to auto-discover all grids
    #   - H1_V10

# ── Model ─────────────────────────────────────────────────────────────────────
model:
  architecture: transformer
  dev:
    hidden_dim:      8
    num_layers:      1
    num_heads:       1
    dropout:         0.4
    feedforward_dim: 4
  production:           # TBD — revisit after dev runs reveal data volume and training dynamics
    hidden_dim:      128
    num_layers:      4
    num_heads:       4
    dropout:         0.2
    feedforward_dim: 512

# ── Training ──────────────────────────────────────────────────────────────────
training:
  optimizer:           adam
  loss:                mse
  learning_rate:       1.0e-7  # starting LR; updated by lr_finder (https://github.com/davidtvs/pytorch-lr-finder)
  lr_scheduler:        cosine   # options: cosine | step | none
  eval_every_n_epochs: 1
  dev:
    batch_size:              128
    num_epochs:              3
    early_stopping_patience: 3
  production:           # TBD — revisit after dev runs
    batch_size:              512 # decide based on GPU constraints and total training samples
    num_epochs:              100
    early_stopping_patience: 10

# ── Paths ─────────────────────────────────────────────────────────────────────
paths:
  preprocessed_dir: outputs/arctic_domain/preprocessed/
  scaler:           outputs/arctic_domain/scaler.pkl
  best_model:       outputs/arctic_domain/models/best_model.pt
  predictions:      outputs/arctic_domain/predictions/
  evaluation:       outputs/arctic_domain/evaluation/
