domain: arctic_domain

# ── GCS ───────────────────────────────────────────────────────────────────────
gcs:
  bucket: gs://circumpolar-readonly/raw
  # Grid folders are discovered at runtime by listing bucket subfolders.
  # EDA uses only these two; preprocessing uses all discovered grids.
  eda_grids:
    - H1_V10
    - H1_V7
  target_subfolder: all_merged  # targets live in <grid>/<scenario>_split/all_merged/

# ── Scenarios ─────────────────────────────────────────────────────────────────
scenarios:
  - ssp1_2_6_mri_esm2_0
  - ssp5_8_5_mri_esm2_0

# ── Input files ───────────────────────────────────────────────────────────────
inputs:
  static:
    - soil-texture.nc
    - drainage.nc
    - fri-fire.nc
    - topo.nc
    - vegetation.nc
  dynamic_time_only:
    - co2.nc            # historical CO2; dim 'year' (int 1901–2024); linearly interpolated to monthly in preprocessing
    - projected-co2.nc  # projected CO2; dim 'year' (int 2025–2100); linearly interpolated to monthly in preprocessing
  dynamic_spatiotemporal:
    - historic-climate.nc
    - projected-climate.nc
    - historic-explicit-fire.nc   # yearly — excluded (near-constant spatial mean)
    - projected-explicit-fire.nc  # yearly — excluded

# ── Target files ──────────────────────────────────────────────────────────────
# Suffix _tr = historical, _sc = projected
# Historical targets only exist under ssp1_2_6 split folder (not ssp5_8_5)
targets:
  - name: ALD
    resolution: yearly
    historical: ALD_yearly_tr.nc
    projected: ALD_yearly_sc.nc
  - name: GPP
    resolution: monthly
    historical: GPP_monthly_tr.nc
    projected: GPP_monthly_sc.nc
  - name: RECO
    resolution: monthly
    historical: RECO_monthly_tr.nc
    projected: RECO_monthly_sc.nc
  - name: VEGC
    resolution: yearly
    historical: VEGC_yearly_tr.nc
    projected: VEGC_yearly_sc.nc

# ── Preprocessing ─────────────────────────────────────────────────────────────
preprocessing:
  # DEV SUBSET — remove 'grids' key to process all grids discovered in bucket
  grids:
    - H1_V10
    # - H1_V7
  random_seed: 42
  train_frac: 0.70
  val_frac:   0.15
  test_frac:  0.15          # remainder
  seq_len:    10            # dev=10, production=24 (2 years of monthly data)
  stride:     360           # dev = 360, production = 1 (sliding window with stride of 1 month)

# ── Model ─────────────────────────────────────────────────────────────────────
# NOTE: all model and training hyperparameters below are for development, production should change these —
# revisit after EDA reveals total data volume and after PR approval.
model:
  architecture:    transformer
  hidden_dim:      8     # dev=8, production=128 (need to decide production value)
  num_layers:      1     # dev=1, production=4 (need to decide production value)
  num_heads:       1     # dev=1, production=4 (need to decide production value)
  dropout:         0.4   # dev=0.4, production=0.2 (need to decide production value)
  feedforward_dim: 4     # dev=4, production=512 (need to decide production value)

# ── Training ──────────────────────────────────────────────────────────────────
training:
  optimizer:               adam
  loss:                    mse
  learning_rate:           01e-7 # This is starting learning rate, it will be modified by the lr_finder (https://github.com/davidtvs/pytorch-lr-finder)
  batch_size:              16    # dev = 256, production = 512 (need to decide production value)
  num_epochs:              3     # dev = 5, production = 100
  early_stopping_patience: 3     # dev = 3, production = 10
  eval_every_n_epochs:     1 
  lr_scheduler:            cosine   # options: cosine | step | none

# ── Paths ─────────────────────────────────────────────────────────────────────
paths:
  preprocessed_dir: outputs/arctic_domain/preprocessed/
  scaler:           outputs/arctic_domain/scaler.pkl
  best_model:       outputs/arctic_domain/models/best_model.pt
  predictions:      outputs/arctic_domain/predictions/
  evaluation:       outputs/arctic_domain/evaluation/
