domain: arctic_domain
mode: production  # dev | production — selects hyperparameter profile; flip here to switch modes

# ── GCS ───────────────────────────────────────────────────────────────────────
gcs:
  bucket: gs://circumpolar-readonly/raw
  project_id: spherical-berm-323321  # for the ADC login hint in _verify_gcs_access's error message
  eda_grids:
    - H1_V10
    - H1_V7
  target_subfolder: all_merged  # targets live in <grid>/<scenario>_split/all_merged/

# ── Scenarios ─────────────────────────────────────────────────────────────────
scenarios:
  - ssp1_2_6_mri_esm2_0
  - ssp5_8_5_mri_esm2_0

# ── Time axis ─────────────────────────────────────────────────────────────────
time:
  projected_start_year: 2025   # historical (_tr) < this year; projected (_sc) >= this year
  scenarios:                   # monthly axis per scenario family (built with freq=MS)
    ssp1: {start: "1901-01-01", end: "2100-12-01"}   # historical + projected
    ssp5: {start: "2025-01-01", end: "2100-12-01"}   # projected only

# ── Input files ───────────────────────────────────────────────────────────────
inputs:
  static:
    - soil-texture.nc
    - drainage.nc
    - fri-fire.nc
    - topo.nc
    - vegetation.nc
  dynamic_time_only:
    - co2.nc            # historical CO2; dim 'year' (int 1901–2024); linearly interpolated to monthly
    - projected-co2.nc  # projected CO2; dim 'year' (int 2025–2100); linearly interpolated to monthly
  dynamic_spatiotemporal:
    - historic-climate.nc
    - projected-climate.nc
    - historic-explicit-fire.nc   # yearly — excluded (near-constant spatial mean)
    - projected-explicit-fire.nc  # yearly — excluded

# ── Target files ──────────────────────────────────────────────────────────────
# Suffix _tr = historical, _sc = projected
# Historical targets only exist under ssp1_2_6 split folder (not ssp5_8_5)
targets:
  - name: ALD
    resolution: yearly
    historical: ALD_yearly_tr.nc
    projected: ALD_yearly_sc.nc
  - name: GPP
    resolution: monthly
    historical: GPP_monthly_tr.nc
    projected: GPP_monthly_sc.nc
  - name: RECO
    resolution: monthly
    historical: RECO_monthly_tr.nc
    projected: RECO_monthly_sc.nc
  - name: VEGC
    resolution: yearly
    historical: VEGC_yearly_tr.nc
    projected: VEGC_yearly_sc.nc

# ── Preprocessing ─────────────────────────────────────────────────────────────
preprocessing:
  random_seed: 42
  train_frac: 0.60
  val_frac:   0.20
  test_frac:  0.20
  split_lat_bins: 6   # whole GRIDS (not pixels) are assigned to train/val/test — see
                      # assign_grid_splits() in 01_preprocess.py. Grids are binned into this
                      # many latitude strata (quantile-based) before the 60/20/20 cut is applied
                      # within each stratum, so held-out grids don't cluster in one climate zone.
                      # Longitude sectoring was considered and deliberately left out for now —
                      # verify geographic balance via plot_data_split_map's output first.
  train_size: 50000   # default is deliberately the smallest capped size — a bare/accidental run
                      # (no --train-size) must never trigger a full circumpolar fetch (hundreds of
                      # GB, hours). Override via --train-size for larger learning-curve points
                      # (500000 / 2000000) — every size uses capped_stride below, uncapped/"full"
                      # training is not supported.
  val_size:   50000   # capped, constant across all experiments — keeps val fast and val.pkl small
  test_size:  50000   # capped, constant across all experiments — same rationale as val_size
  capped_stride: 24   # accounting/materialization stride used for all of train/val/test. Each
                      # pixel then contributes far fewer windows than a stride=1 full scan, so
                      # round-robin subsampling must draw from many more grids to reach the same
                      # window budget — this is what makes a capped dataset geographically
                      # representative instead of coming from a handful of pixels.
  max_workers: 8      # concurrent isolated-subprocess grid fetches. 8 is the validated-safe
                      # value on vm-cpu-sandeep (n2-standard-32, 128GB RAM, no swap) — 24 OOM-
                      # locked the VM (see arctic_description_data_handling.md). Raise
                      # incrementally (try 12 next) only while watching memory directly, same as
                      # every past change to this value.
  fetch_timeout_seconds: 180   # per-attempt timeout for one grid's isolated-subprocess fetch
  fetch_retries: 2             # extra attempts after the first, before giving up on a grid
  failed_marker_ttl_seconds: 3600   # retry a previously-failed grid after this long, in case
                                    # the earlier failure was a transient blip rather than a
                                    # genuinely broken grid
  dev:                # fast smoke test — tiny model, few windows, a handful of grids
    seq_len: 12
    grids:             # required in dev. Under the grid-level split, ONE grid can't
                        # productively serve all three splits (assign_grid_splits puts a whole
                        # grid in exactly one) — assign_grid_splits auto-clamps its stratum count
                        # for small grid lists (see its docstring) so this no longer needs exact
                        # latitude spread to work, just enough grids overall (>=5 recommended;
                        # verified via tests/arctic_domain/test_grid_split.py's small-grid-count
                        # case). Numeric H-index spread here is still a nice-to-have for realism,
                        # not a correctness requirement.
      - H1_V10
      - H1_V7
      - H9_V9
      - H14_V6
      - H19_V10
      - H23_V13
  production:
    seq_len: 12
    # grids: omitted — auto-discovers all grid folders in the GCS bucket

# ── Model ─────────────────────────────────────────────────────────────────────
model:
  architecture: transformer   # only 'transformer' is implemented; key reserved for future variants
  dev:                  # tiny model for a fast smoke test (not meant to learn well)
    hidden_dim:      16
    num_layers:      1
    num_heads:       2
    dropout:         0.1
    feedforward_dim: 32
  production:           # huge dataset (all grids, ~1M+ windows/grid): large model to exploit the volume. A100 40GB, no grid search.
    hidden_dim:      256
    num_layers:      6
    num_heads:       8
    dropout:         0.15
    feedforward_dim: 1024

# ── Training ──────────────────────────────────────────────────────────────────
training:
  optimizer:           adamw
  loss:                mse
  weight_decay:        1.0e-4
  initial_lr:          1.0e-6   # sweep start for LR finder; optimal typically 1e-5–3e-4 for AdamW transformers
  optimized_lr:        null     # set after running LR finder (https://github.com/davidtvs/pytorch-lr-finder); overrides initial_lr when set
  lr_scheduler:        cosine   # options: cosine | step | none
  eval_every_n_epochs: 2        # was 1 - validating every epoch roughly doubled total data-pass
                                # volume for little benefit; early_stopping_patience below is
                                # rebalanced so the epoch-equivalent tolerance is unchanged
  num_workers:         4        # parallel DataLoader worker processes - without this, batches are
                                # assembled synchronously on the main process (num_workers=0
                                # default), which bottlenecks a small/fast model like this one on
                                # single-threaded Python overhead instead of GPU compute. 4 leaves
                                # headroom on the VM's 12 vCPUs; a local CPU-only dev run pays a
                                # small, negligible worker-startup cost too.
  grad_clip_norm:      1.0      # max gradient norm (torch.nn.utils.clip_grad_norm_), a common
                                # default for transformers - guards against the kind of sudden
                                # loss-spike/divergence a bad batch or high post-warmup LR can
                                # otherwise cause. shared/training.py falls back to this same
                                # value via .get() if a domain's config omits the key.
  dev:
    batch_size:              128
    num_epochs:              3
    warmup_epochs:           1
    early_stopping_patience: 3
  production:           # batch 2048 (was 1024) - GPU memory was at 2.3GB/40GB, far from the
                        # ceiling, so a bigger batch means fewer Python-loop iterations per
                        # epoch for the same data volume. memory stays well under 40GB at
                        # seq_len 12 (params <~10M)
    batch_size:              2048
    num_epochs:              100
    warmup_epochs:           10
    early_stopping_patience: 5   # was 10 - halved to match eval_every_n_epochs doubling to 2,
                                # so the epoch-equivalent tolerance (5*2=10) is unchanged

# ── Paths ─────────────────────────────────────────────────────────────────────
paths:
  preprocessed_dir: outputs/arctic_domain/preprocessed/
  scaler:           outputs/arctic_domain/scaler.pkl
  best_model:       outputs/arctic_domain/models/best_model.pt
  predictions:      outputs/arctic_domain/predictions/
  evaluation:       outputs/arctic_domain/evaluation/

# ── Experiment tracking (MLflow) ──────────────────────────────────────────────
mlflow:
  enabled:      true
  tracking_uri: mlruns         # local file store at repo root; no server needed
  experiment:   arctic_domain
